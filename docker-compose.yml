services:
  postgres:
    image: postgres:16-alpine
    container_name: accounting-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting_dev_password
      POSTGRES_DB: accounting_system
    ports:
      - "5432:5432"
    volumes:
      - accounting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  accounting_postgres_data:
