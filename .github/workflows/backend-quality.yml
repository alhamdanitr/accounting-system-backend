name: Backend Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: accounting
          POSTGRES_PASSWORD: accounting_dev_password
          POSTGRES_DB: accounting_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accounting -d accounting_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://accounting:accounting_dev_password@localhost:5432/accounting_system?schema=public
      JWT_ACCESS_SECRET: e2e-access-secret-change-me
      JWT_REFRESH_SECRET: e2e-refresh-secret-change-me
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Audit route guards
        run: pnpm run check:routes

      - name: Audit structured logging policy
        run: pnpm run check:console

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Unit tests and accounting coverage policy
        run: pnpm run check:accounting-coverage

      - name: E2E tests
        run: pnpm exec jest --config ./test/jest-e2e.json --runInBand

      - name: Build
        run: pnpm exec nest build
